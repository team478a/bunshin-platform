name: Production Migration History Probe

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSPECT_PRODUCTION_MIGRATION_HISTORY to run the read-only check
        required: true
        type: string
      project_ref:
        description: Approved 20-character Supabase project reference
        required: true
        type: string
      operation:
        description: Read-only inspection to run
        required: true
        default: migration_history
        type: choice
        options:
          - migration_history
          - manaberu_registration

permissions:
  contents: read

concurrency:
  group: production-migration-history-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require main and explicit target confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_PROJECT_REF: ${{ inputs.project_ref }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "migration_history" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$CONFIRMATION" = "INSPECT_PRODUCTION_MIGRATION_HISTORY"
          else
            test "$OPERATION" = "manaberu_registration"
            test "$GITHUB_REF" = "refs/heads/codex/manaberu-public-training-audit"
            test "$CONFIRMATION" = "INSPECT_MANABERU_REGISTRATION"
          fi
          [[ "$EXPECTED_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Read production migration history only
        if: inputs.operation == 'migration_history'
        env:
          VERCEL_ENV: production
          MIGRATION_PROBE_EXPECTED_PROJECT_REF: ${{ inputs.project_ref }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST || secrets.SUPABASE_SESSION_POOLER_HOST }}
        run: |
          set -euo pipefail
          pnpm db:migration:history:probe | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Read Manaberu registration and training readiness only
        if: inputs.operation == 'manaberu_registration'
        env:
          VERCEL_ENV: production
          MANABERU_AUDIT_EXPECTED_PROJECT_REF: ${{ inputs.project_ref }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST || secrets.SUPABASE_SESSION_POOLER_HOST }}
        run: |
          set -euo pipefail
          pnpm db:generate
          pnpm db:manaberu:production:audit | tee -a "$GITHUB_STEP_SUMMARY"
