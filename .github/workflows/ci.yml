name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      DIRECT_URL: postgresql://build:build@localhost:5432/build
      SESSION_SECRET: build-only-secret-build-only-secret
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Restore trusted CI build cache
        id: ci-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ci-build-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ci-build-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:external-read-poc
      - run: pnpm exec e2e-web install chromium --with-deps
      - run: pnpm test:learning-ui
        env:
          E2E_TELEMETRY_DISABLED: '1'
      - run: pnpm build
      - name: Save trusted main CI build cache
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.ci-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ steps.ci-build-cache.outputs.cache-primary-key }}

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bunshin_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bunshin_platform_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bunshin_platform_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      # Explicit setup of the disposable CI database, never the production build path.
      - run: pnpm db:migrate:deploy
      - run: pnpm db:assert-ready
      - run: pnpm test:integration
      - name: Install native PostgreSQL client for release tests
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Verify native release transactions and Prisma history on disposable PostgreSQL
        run: pnpm --filter @bunshin/database exec node --test scripts/test-native-release-psql.mjs
      - name: Verify TLS trust and hostname checks with disposable PostgreSQL
        run: pnpm --filter @bunshin/database exec node --test scripts/test-release-tls.mjs
