name: Verify production release schema (read-only, 2026-10-20)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY_RELEASE_20261020_SCHEMA_TO_vtkzinaudznwbsjoyszk (read-only)
        required: true
        type: string
      project_ref:
        description: Approved 20-character Supabase project reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration-apply
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require main and exact read-only target confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "VERIFY_RELEASE_20261020_SCHEMA_TO_vtkzinaudznwbsjoyszk"
          test "$EXPECTED_PROJECT_REF" = "vtkzinaudznwbsjoyszk"

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check schema only; never apply or resolve migrations
        env:
          VERCEL_ENV: production
          RELEASE_READINESS_EXPECTED_PROJECT_REF: ${{ inputs.project_ref }}
          RELEASE_READINESS_CONFIRMATION: ${{ inputs.confirmation }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST || secrets.SUPABASE_SESSION_POOLER_HOST }}
        run: |
          set -euo pipefail
          node packages/database/scripts/verify-release-readiness-20261020.mjs | tee -a "$GITHUB_STEP_SUMMARY"
